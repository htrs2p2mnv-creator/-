
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Little Website</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #fff5f8;
  color: #493c43;
  font-family: Arial, sans-serif;
  text-align: center;
}
main {
  padding: 50px 22px;
}
h1 {
  font-size: 30px;
  margin-top: 45px;
}
p {
  color: #8c7882;
  line-height: 1.8;
}
.card {
  background: white;
  border-radius: 22px;
  padding: 25px 18px;
  margin-top: 28px;
  box-shadow: 0 5px 20px #e9cbd633;
}
button {
  border: 0;
  border-radius: 24px;
  padding: 14px 25px;
  background: #f3b8cb;
  color: white;
  font-size: 16px;
  margin-top: 12px;
}
</style>
</head>
<body>
<main>
  <p>♡ WELCOME ♡</p>
  <h1>My Little World 🎀</h1>
  <p>나만의 작은 공간에 온 걸 환영해!</p>
  <div class="card">
    <h2>✧ ABOUT ✧</h2>
    <p>여기에 나만의 이야기를 담아 보자.</p>
    <button onclick="alert('반가워! ♡')">CLICK ME ♡</button>
  </div>
  <div class="card">
    <h2>♡ MY SPACE ♡</h2>
    <p>사진과 글을 추가할 수 있는 공간이야.</p>
  </div>
</main>
</body>
</html>
